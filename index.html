
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10090e">
  <meta name="description" content="Enter my little corner of darkness.">
  <title>YOUR NAME 🖤</title>

  <!-- Gothic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #f3a8c5;
      --pink-light: #ffd9e7;
      --pink-dark: #bd557d;
      --text: #fff3f7;
      --muted: #e0c5d0;
      --background: #10090e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: var(--background);
    }

    .hero {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 22px;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      overflow: hidden;

      /* EDIT: Change background.jpg to your image filename */
      background-image:
        linear-gradient(
          180deg,
          rgba(12, 6, 11, 0.28) 0%,
          rgba(12, 6, 11, 0.40) 35%,
          rgba(12, 6, 11, 0.78) 100%
        ),
        url("0eb61ce0b5e5444f909b7a819c955c22-3.jpeg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* Soft pink ambient glow */
    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(
          ellipse at 50% 42%,
          rgba(174, 62, 111, 0.20),
          transparent 60%
        );
      pointer-events: none;
    }

    .content {
      width: 100%;
      max-width: 390px;
      text-align: center;
      margin: auto;
      animation: appear 900ms ease both;
    }

    .ornament {
      color: var(--pink);
      font-size: 17px;
      letter-spacing: 8px;
      margin-bottom: 22px;
      text-shadow: 0 0 18px #ff8cbb66;
    }

    .eyebrow {
      color: var(--pink-light);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 0 0 12px;
      font-weight: 600;
      text-shadow: 0 2px 12px #000;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(46px, 13vw, 68px);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: 0.5px;
      overflow-wrap: anywhere;
      margin: 0;
      color: #fff0f6;
      text-shadow:
        0 2px 6px #000,
        0 0 35px rgba(241, 136, 181, 0.35);
    }

    .divider {
      width: 64px;
      height: 1px;
      margin: 23px auto;
      background: linear-gradient(
        90deg,
        transparent,
        var(--pink),
        transparent
      );
    }

    .bio {
      color: #fff0f5;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(19px, 5vw, 23px);
      font-style: italic;
      line-height: 1.5;
      margin: 0 auto 29px;
      max-width: 310px;
      text-shadow: 0 2px 12px #000;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 60px;
      padding: 17px 20px;
      border: 1px solid #ffd0e2;
      border-radius: 13px;
      color: #220d18;
      background: linear-gradient(
        135deg,
        #ffd8e7,
        #f3a8c5 55%,
        #e68db1
      );
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.4px;
      box-shadow:
        0 8px 32px rgba(226, 111, 157, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(0.975);
    }

    .button:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .heart {
      font-size: 19px;
      line-height: 1;
    }

    .footer {
      margin-top: 23px;
      color: #ffe0eb;
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px #000;
    }

    .footer span {
      color: var(--pink);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content {
        animation: none;
      }

      .button {
        transition: none;
      }
    }

    /* Short phone screens */
    @media (max-height: 600px) {
      .hero {
        padding-top: 24px;
        padding-bottom: 24px;
      }

      .ornament {
        margin-bottom: 12px;
      }

      .divider {
        margin: 15px auto;
      }

      .bio {
        margin-bottom: 18px;
      }

      .footer {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <section class="content" aria-labelledby="display-name">

      <div class="ornament" aria-hidden="true">♡ ✧ ♡</div>

      <p class="eyebrow">† welcome to my world †</p>

      <!-- EDIT: Replace YOUR NAME with your display name -->
      <h1 id="display-name">YOUR NAME 🖤</h1>

      <div class="divider" aria-hidden="true"></div>

      <!-- EDIT: Write your own short bio here -->
      <p class="bio">
        A little darkness, a little sweetness...
        and a heart that belongs to the night. ♡
      </p>

      <!-- EDIT: Replace the URL below with your destination -->
      <a
        class="button"
        href="https://tapforallmylinks.com/ellathegoth//"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="heart" aria-hidden="true">♥</span>
        <span>ENTER MY ONLYFANS</span>
        <span class="heart" aria-hidden="true">♥</span>
      </a>

      <div class="footer">
        <span>♡</span> made of midnight &amp; roses <span>♡</span>
      </div>

    </section>
  </main>
</body>
</html>
